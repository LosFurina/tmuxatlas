name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  prepare-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft 2>/dev/null); then
            if [[ "$(jq -r .isDraft <<<"$release_json")" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
            echo "Reusing existing draft release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "TmuxAtlas $RELEASE_TAG"
          fi

  publish-artifacts:
    needs: prepare-release
    uses: ./.github/workflows/goreleaser.yml
    with:
      ref: ${{ github.ref_name }}
      snapshot: false
    permissions:
      contents: write
      id-token: write

  publish-container:
    needs: prepare-release
    uses: ./.github/workflows/container-release.yml
    with:
      ref: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  publish-release:
    needs: [publish-artifacts, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
