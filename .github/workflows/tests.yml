name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run check:external-fonts && npm run check:bundle
        working-directory: web
      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4
        with:
          name: embedded-web
          path: pkg/server/dist
          retention-days: 1

  go:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download embedded web assets
        uses: actions/download-artifact@v4
        with:
          name: embedded-web
          path: pkg/server/dist
      - run: sh -n install.sh && test -x install.sh
      - run: go test -race ./...
      - run: go vet ./...

  browser:
    needs: [frontend, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: mkdir -p dist && go build -o dist/tmuxatlas .
      - run: tmux new-session -d -s tmuxatlas-e2e && npm run e2e
        working-directory: web
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  container:
    needs: [frontend, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tmuxatlas:ci
          build-args: |
            VERSION=ci
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=container-ci
          cache-to: type=gha,mode=max,scope=container-ci
      - name: Verify hardened Compose and persistent Hub identity
        env:
          TMUXATLAS_TEST_PROJECT: tmuxatlas-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TMUXATLAS_TEST_VOLUME: tmuxatlas-ci-${{ github.run_id }}-${{ github.run_attempt }}-data
        run: ./scripts/container-smoke.sh
      - name: Upload container diagnostics
        if: failure()
        run: |
          docker compose -p "$TMUXATLAS_TEST_PROJECT" ps || true
          docker compose -p "$TMUXATLAS_TEST_PROJECT" logs --no-color || true
        env:
          TMUXATLAS_TEST_PROJECT: tmuxatlas-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TMUXATLAS_IMAGE: tmuxatlas
          TMUXATLAS_IMAGE_TAG: ci
          TMUXATLAS_PULL_POLICY: never
          TMUXATLAS_PUBLIC_URL: https://staging.example.com
          TMUXATLAS_ORIGIN_PORT: 17655
          TMUXATLAS_VOLUME: tmuxatlas-ci-${{ github.run_id }}-${{ github.run_attempt }}-data
