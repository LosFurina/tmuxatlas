name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Validate installer
        run: sh -n install.sh && test -x install.sh

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Install Chromium and tmux for E2E
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tmux
        working-directory: web

      - name: Build E2E server
        run: |
          mkdir -p dist
          go build -o dist/tmuxatlas .

      - name: Passkey E2E
        run: |
          tmux new-session -d -s tmuxatlas-e2e
          npm run e2e
        working-directory: web
