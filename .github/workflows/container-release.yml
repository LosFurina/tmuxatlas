name: Container Release

on:
  workflow_call:
    inputs:
      ref:
        description: SemVer Git tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/losfurina/tmuxatlas
          tags: |
            type=raw,value=${{ inputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ inputs.ref }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.ref }}
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=container-release
          cache-to: type=gha,mode=max,scope=container-release
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.0

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/losfurina/tmuxatlas@${DIGEST}"
