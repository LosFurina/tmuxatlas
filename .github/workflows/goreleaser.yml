name: GoReleaser

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      snapshot:
        description: Build without publishing
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      snapshot:
        description: Build without publishing
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ inputs.snapshot && '--snapshot --skip=sign' || '--skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to the existing GitHub release
        if: inputs.snapshot == false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          shopt -s nullglob
          artifacts=(
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          )
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts were produced" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
