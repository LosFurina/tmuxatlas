version: 2
release:
  github:
    owner: LosFurina
    name: tmuxatlas
before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"
builds:
  - id: tmuxatlas
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -extldflags="-static"
      - -X '{{ .ModulePath }}/pkg/common.SUMMARY=v{{ .Version }}'
      - -X '{{ .ModulePath }}/pkg/common.BRANCH={{ .Branch }}'
      - -X '{{ .ModulePath }}/pkg/common.VERSION={{ .Tag }}'
      - -X '{{ .ModulePath }}/pkg/common.COMMIT={{ .Commit }}'
    mod_timestamp: "{{ .CommitTimestamp }}"
sboms:
  - artifacts: archive
archives:
  - id: tmuxatlas
    ids:
      - tmuxatlas
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ .Arm }}"
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      [
        "sign-blob",
        "--new-bundle-format=true",
        "--bundle=${signature}",
        "${artifact}",
        "--yes",
      ]
    artifacts: checksum
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: '{{ trimprefix .Summary "v" }}'
# GitHub generates release notes when the tag-triggered workflow creates the draft.
changelog:
  disable: true
